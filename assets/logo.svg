<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="64" height="64">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1836"/>
      <stop offset="0.42" stop-color="#152a55"/>
      <stop offset="0.7" stop-color="#6b3f66"/>
      <stop offset="0.86" stop-color="#d9772e"/>
      <stop offset="1" stop-color="#f2a83c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
